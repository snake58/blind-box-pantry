function clamp(v,a,b){ return v<a?a:(v>b?b:v); }
function lerp(a,b,t){ return a+(b-a)*t; }
function mulberry32(seed){ let s=seed>>>0; return function(){ s|=0; s=s+0x6D2B79F5|0; let t=Math.imul(s^s>>>15,1|s); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
function hex(c){ const h=v=>clamp(Math.round(v),0,255).toString(16).padStart(2,"0"); return "#"+h(c.r)+h(c.g)+h(c.b); }
function shade(c,f){ return { r:clamp(c.r*f,0,255), g:clamp(c.g*f,0,255), b:clamp(c.b*f,0,255) }; }
function mixc(c1,w1,c2,w2){ const t=w1+w2; return { r:(c1.r*w1+c2.r*w2)/t, g:(c1.g*w1+c2.g*w2)/t, b:(c1.b*w1+c2.b*w2)/t }; }
function rr(ctx,x,y,w,h,r){ ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
function easeOutBack(t){ const c=1.70158; return 1+(c+1)*Math.pow(t-1,3)+c*Math.pow(t-1,2); }
function easeOutCubic(t){ return 1-Math.pow(1-t,3); }
function spring(cur,target,stiff,damp,dt){ // returns {v,x} update for 1-D spring; state kept in obj
  return null;
}

/* ---------------- audio: 100% procedural WebAudio ASMR ----------------
   Peel (sticky bandpass noise), pop, wet squish, smash thump,
   reveal shimmer, legendary fanfare, coin blip, plus a soft
   generative music-box loop. Music starts on first gesture. */
const Sfx = window.Sfx = {
  ctx:null, muted:false, _master:null, _musicBus:null, _noiseBuf:null, _delay:null,
  _mStep:0, _mNext:0, _mTimer:0, _musicOn:false, _peelLast:0,
  mf(m){ return 440*Math.pow(2,(m-69)/12); },
  ensure(){
    if(this.ctx) return true;
    try{
      const AC = window.AudioContext || window.webkitAudioContext;
      if(!AC) return false;
      const ctx = this.ctx = new AC();
      const master = this._master = ctx.createGain(); master.gain.value = this.muted?0:1; master.connect(ctx.destination);
      const mb = this._musicBus = ctx.createGain(); mb.gain.value = 0.42; mb.connect(master);
      const dly = ctx.createDelay(1.0); dly.delayTime.value = 0.34;
      const fb = ctx.createGain(); fb.gain.value = 0.32;
      const wet = ctx.createGain(); wet.gain.value = 0.5;
      dly.connect(fb); fb.connect(dly); dly.connect(wet); wet.connect(mb);
      this._delay = dly;
      const len = ctx.sampleRate|0, buf = ctx.createBuffer(1,len,ctx.sampleRate), ch = buf.getChannelData(0);
      for(let i=0;i<len;i++) ch[i]=Math.random()*2-1;
      this._noiseBuf = buf;
      return true;
    }catch(e){ return false; }
  },
  setMuted(m){ this.muted=!!m; try{ if(this._master) this._master.gain.value=this.muted?0:1; }catch(e){} },
  tone(f,dur,type,vol,slideTo,when,dest){
    if(!this.ctx||this.muted) return;
    try{
      const t = when||this.ctx.currentTime;
      const o=this.ctx.createOscillator(), g=this.ctx.createGain();
      o.type=type||"sine"; o.frequency.setValueAtTime(Math.max(30,f),t);
      if(slideTo) o.frequency.exponentialRampToValueAtTime(Math.max(30,slideTo),t+dur);
      g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(vol||0.2,t+0.012);
      g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
      o.connect(g); g.connect(dest||this._master); o.start(t); o.stop(t+dur+0.05);
    }catch(e){}
  },
  noise(dur,freq,vol,q,type,when){
    if(!this.ctx||this.muted) return;
    try{
      const t=when||this.ctx.currentTime;
      const src=this.ctx.createBufferSource(); src.buffer=this._noiseBuf; src.loop=true;
      src.playbackRate.value = 0.7+Math.random()*0.6;
      const f=this.ctx.createBiquadFilter(); f.type=type||"bandpass"; f.frequency.value=freq||1200; f.Q.value=q||1;
      const g=this.ctx.createGain();
      g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(vol||0.25,t+0.025);
      g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
      src.connect(f); f.connect(g); g.connect(this._master); src.start(t); src.stop(t+dur+0.05);
    }catch(e){}
  },
  click(){ this.tone(660,0.06,"triangle",0.10); },
  select(){ this.tone(620,0.08,"sine",0.14); this.tone(930,0.10,"sine",0.09,null,this.ctx?this.ctx.currentTime+0.05:0); },
  /* --- ASMR toy sounds --- */
  peel(prog){ // sticky tape peel: bandpass noise climbing with progress + tacky rips
    const now=Date.now();
    if(now-this._peelLast<70) return; this._peelLast=now;
    if(!this.ctx||this.muted) return;
    const f=900+prog*2600+Math.random()*300;
    this.noise(0.09,f,0.16,2.2);
    if(Math.random()<0.4) this.noise(0.05,f*1.7,0.10,3); // tacky rip
  },
  tapeRip(){ this.noise(0.22,2400,0.22,1.1); this.noise(0.14,900,0.14,1,"lowpass"); },
  pop(){ // classic bubble pop
    if(!this.ctx||this.muted) return;
    this.tone(320,0.09,"sine",0.22,760);
    this.noise(0.05,3000,0.10,1.5,"highpass");
  },
  smash(){ // box stomp thump
    if(!this.ctx||this.muted) return;
    this.noise(0.16,420,0.30,0.8,"lowpass");
    this.tone(140,0.22,"sine",0.26,55);
    this.noise(0.08,2400,0.10,1.2,"highpass"); // cardboard crackle
  },
  crinkle(){ this.noise(0.12,3600,0.12,0.9,"highpass"); },
  squish(deep){ // wet squish: lowpass noise + wobble sine
    if(!this.ctx||this.muted) return;
    const t=this.ctx.currentTime;
    this.noise(0.24,700,0.26,0.9,"lowpass",t);
    this.tone(180,0.24,"sine",0.16,90,t);
    this.tone(90,0.20,"triangle",0.12,140,t+0.03);
    if(deep){ this.noise(0.18,300,0.20,1,"lowpass",t+0.10); }
  },
  shimmer(){ // reveal sparkle arpeggio
    if(!this.ctx||this.muted) return;
    const t=this.ctx.currentTime;
    [88,93,97,100,105].forEach((m,i)=>{
      this.tone(this.mf(m),0.5,"sine",0.12,null,t+i*0.07,this._musicBus);
    });
    this.noise(0.5,7000,0.05,0.8,"highpass",t);
  },
  fanfare(){ // legendary!
    if(!this.ctx||this.muted) return;
    const t=this.ctx.currentTime;
    [72,76,79,84,88,91].forEach((m,i)=>this.tone(this.mf(m),0.7,"triangle",0.15,null,t+i*0.10));
    this.noise(1.1,6000,0.07,0.7,"highpass",t+0.2);
    this.tone(65,1.2,"sine",0.14,65,t);
  },
  coin(){ const t=this.ctx?this.ctx.currentTime:0; this.tone(1568,0.09,"square",0.07); this.tone(2093,0.16,"square",0.06,null,t+0.07); },
  unlock(){ const t=this.ctx?this.ctx.currentTime:0; [67,72,76,79,84].forEach((m,i)=>this.tone(this.mf(m),0.4,"triangle",0.14,null,t+i*0.09)); },
  whoosh(){ this.noise(0.3,1400,0.12,0.7); },
  /* --- generative music: soft music-box lullaby + bass --- */
  _chords:[[57,60,64],[53,57,60],[55,62,67],[52,55,59]],
  _penta:[76,79,81,84,86,88,91],
  startMusic(){
    if(!this.ctx||this._musicOn) return; this._musicOn=true;
    this._mNext=this.ctx.currentTime+0.1; this._mStep=0;
    const tick=()=>{
      if(!this._musicOn) return;
      try{
        while(this._mNext < this.ctx.currentTime+0.7){
          const step=this._mStep, t=this._mNext;
          if(step%16===0){
            const ch=this._chords[(step/16|0)%this._chords.length];
            ch.forEach(m=>{
              const o=this.ctx.createOscillator(), g=this.ctx.createGain();
              o.type="sine"; o.frequency.value=this.mf(m-12);
              g.gain.setValueAtTime(0.0001,t); g.gain.linearRampToValueAtTime(0.045,t+1.4);
              g.gain.linearRampToValueAtTime(0.0001,t+4.4);
              o.connect(g); g.connect(this._musicBus); o.start(t); o.stop(t+4.6);
            });
          }
          if(step%4===0 && Math.random()<0.55){
            const m=this._penta[(Math.random()*this._penta.length)|0];
            const o=this.ctx.createOscillator(), g=this.ctx.createGain();
            o.type="sine"; o.frequency.value=this.mf(m);
            g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(0.085,t+0.012);
            g.gain.exponentialRampToValueAtTime(0.0001,t+1.3);
            o.connect(g); g.connect(this._musicBus); g.connect(this._delay);
            o.start(t); o.stop(t+1.4);
          }
          this._mNext+=0.46; this._mStep++;
        }
      }catch(e){}
      this._mTimer=setTimeout(tick,200);
    };
    tick();
  },
  stopMusic(){ this._musicOn=false; try{clearTimeout(this._mTimer);}catch(e){} }
};

function rollRarity(rng, golden){
  const ws = golden ? [0,58,30,12] : RAR.map(r=>r.w);
  let tot=0; for(const w of ws) tot+=w;
  let roll=(rng?rng():Math.random())*tot;
  for(let i=0;i<4;i++){ roll-=ws[i]; if(roll<=0) return i; }
  return 0;
}

function pickItem(themeId, rarIdx, rng){
  const pool = THEMES.find(t=>t.id===themeId).items.filter(i=>i.rar===rarIdx);
  return pool[((rng?rng():Math.random())*pool.length)|0];

function activeThemeIdx(){
  for(let i=0;i<Game.themesUnlocked;i++){
    const th=THEMES[i];
    if(th.items.some(it=>!Game.owned[it.id])) return i;
  }
  return Math.min(Game.themesUnlocked, THEMES.length)-1;
}

/* ---------------- procedural kawaii art ---------------- */
function kface(x,y,s,mood,t){
  // s = face width scale; mood: happy|wow|calm|shy|dizzy
  const ex=s*0.30, ey=-s*0.02, er=s*0.085;
  ctx.fillStyle="#2b2135";
  if(mood==="happy"||mood==="shy"){
    ctx.strokeStyle="#2b2135"; ctx.lineWidth=Math.max(2,s*0.07); ctx.lineCap="round";
    [-1,1].forEach(sg=>{
      ctx.beginPath(); ctx.arc(x+sg*ex,y+ey,er*1.35,Math.PI*1.15,Math.PI*1.85); ctx.stroke();
    });
  } else if(mood==="wow"){
    [-1,1].forEach(sg=>{ ctx.beginPath(); ctx.arc(x+sg*ex,y+ey,er*1.5,0,TAU); ctx.fill(); });
    ctx.fillStyle="#fff";
    [-1,1].forEach(sg=>{ ctx.beginPath(); ctx.arc(x+sg*ex-er*0.4,y+ey-er*0.4,er*0.55,0,TAU); ctx.fill(); });
  } else { // calm / dizzy
    [-1,1].forEach(sg=>{ ctx.beginPath(); ctx.arc(x+sg*ex,y+ey,er,0,TAU); ctx.fillStyle="#2b2135"; ctx.fill(); });
    ctx.fillStyle="#fff";
    [-1,1].forEach(sg=>{ ctx.beginPath(); ctx.arc(x+sg*ex-er*0.3,y+ey-er*0.3,er*0.38,0,TAU); ctx.fill(); });
  }
  // blush
  ctx.fillStyle="rgba(255,120,150,0.45)";
  [-1,1].forEach(sg=>{ ctx.beginPath(); ctx.ellipse(x+sg*ex*1.7,y+ey+s*0.22,s*0.14,s*0.09,0,0,TAU); ctx.fill(); });
  // mouth
  ctx.strokeStyle="#2b2135"; ctx.lineWidth=Math.max(2,s*0.06); ctx.lineCap="round";
  ctx.beginPath();

      ctx.beginPath(); ctx.arc(x+f[1]*s*1.4,y-s*0.42+Math.sin(t*2.4+i)*s*0.04,s*0.2,0,TAU); ctx.fill(); });
    kface(x,y+s*0.32,s*0.9,"happy",t);
  },
  sushi(x,y,s,t){
    ctx.fillStyle="#fff8ee";
    rr(ctx,x-s*0.55,y-s*0.25,s*1.1,s*0.85,s*0.25); ctx.fill();
    ctx.fillStyle="#ff8a5c";
    rr(ctx,x-s*0.6,y-s*0.55,s*1.2,s*0.42,s*0.18); ctx.fill();
    ctx.strokeStyle="#fff"; ctx.lineWidth=s*0.05;
    for(let i=0;i<3;i++){ ctx.beginPath(); ctx.moveTo(x-s*0.3+i*s*0.3,y-s*0.52);
      ctx.lineTo(x-s*0.42+i*s*0.3,y-s*0.18); ctx.stroke(); }
    ctx.fillStyle="#2b2b3a"; ctx.fillRect(x-s*0.12,y-s*0.28,s*0.24,s*0.9);
    kface(x,y+s*0.3,s*0.8,"calm",t);
  },
  boba(x,y,s,t){
    ctx.fillStyle="rgba(255,255,255,0.85)";
    ctx.beginPath(); ctx.moveTo(x-s*0.55,y-s*0.55); ctx.lineTo(x+s*0.55,y-s*0.55);
    ctx.lineTo(x+s*0.4,y+s*0.8); ctx.lineTo(x-s*0.4,y+s*0.8); ctx.closePath(); ctx.fill();
    ctx.fillStyle="#e8b878";
    ctx.beginPath(); ctx.moveTo(x-s*0.5,y-s*0.3); ctx.lineTo(x+s*0.5,y-s*0.3);
    ctx.lineTo(x+s*0.38,y+s*0.72); ctx.lineTo(x-s*0.38,y+s*0.72); ctx.closePath(); ctx.fill();
    ctx.fillStyle="#3a2a1a";
    for(let i=0;i<6;i++){ const px=x-s*0.28+(i%3)*s*0.28, py=y+s*0.35+((i/3)|0)*s*0.24;
      ctx.beginPath(); ctx.arc(px,py,s*0.1,0,TAU); ctx.fill(); }
    ctx.strokeStyle="#e84a6a"; ctx.lineWidth=s*0.12; ctx.lineCap="round";
    ctx.beginPath(); ctx.moveTo(x+s*0.18,y-s*0.5); ctx.lineTo(x+s*0.3,y-s*1.05); ctx.stroke();
    kface(x,y-s*0.02,s*0.85,"happy",t);
  },
  candyapple(x,y,s,t){
    ctx.fillStyle="#e84a6a"; ctx.beginPath(); ctx.arc(x,y+s*0.05,s*0.8,0,TAU); ctx.fill();
    const g=ctx.createRadialGradient(x-s*0.25,y-s*0.2,s*0.1,x,y,s);
    g.addColorStop(0,"rgba(255,255,255,0.55)"); g.addColorStop(1,"rgba(255,255,255,0)");
    ctx.fillStyle=g; ctx.beginPath(); ctx.arc(x,y+s*0.05,s*0.8,0,TAU); ctx.fill();
    ctx.strokeStyle="#8a5a2b"; ctx.lineWidth=s*0.08;
    ctx.beginPath(); ctx.moveTo(x,y-s*0.7); ctx.lineTo(x,y-s*1.05); ctx.stroke();
    ctx.fillStyle="#ffe14d";
    ctx.beginPath(); ctx.moveTo(x-s*0.1,y-s*0.75); ctx.lineTo(x+s*0.25,y-s*0.55); ctx.lineTo(x-s*0.02,y-s*0.5); ctx.closePath(); ctx.fill();
    kface(x,y+s*0.1,s*0.95,"shy",t);
  },
  candy(x,y,s,t){
    const g=ctx.createLinearGradient(x-s,y-s,x+s,y+s);
    g.addColorStop(0,"#3b2a6e"); g.addColorStop(0.5,"#7a3fd1"); g.addColorStop(1,"#2a1a4e");
    ctx.fillStyle=g; ctx.beginPath(); ctx.ellipse(x,y,s*0.75,s*0.55,0.3,0,TAU); ctx.fill();
    ctx.fillStyle="#5e2b97";
    [[-1,0.3],[1,-0.3]].forEach(sg=>{
      ctx.save(); ctx.translate(x+sg[0]*s*0.85,y+sg[1]*s*0.5); ctx.rotate(sg[0]*0.6);
      ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(sg[0]*s*0.45,-s*0.3); ctx.lineTo(sg[0]*s*0.45,s*0.3);
      ctx.closePath(); ctx.fill(); ctx.restore(); });
    ctx.fillStyle="#fff";
    for(let i=0;i<6;i++){ const a=i/6*TAU+t*0.5, px=x+Math.cos(a)*s*0.42, py=y+Math.sin(a)*s*0.32;
      ctx.beginPath(); ctx.arc(px,py,s*0.045,0,TAU); ctx.fill(); }
    star2(x-s*0.2,y-s*0.1,s*0.14,"#ffe14d",t);
    kface(x,y+s*0.08,s*0.85,"wow",t);
  },
};
function drawItemShape(shape,x,y,s,t){
  const fn=SHAPES[shape];
  if(fn) fn(x,y,s,t||0);
  else { ctx.fillStyle="#ccc"; ctx.beginPath(); ctx.arc(x,y,s*0.8,0,TAU); ctx.fill(); kface(x,y,s,"calm",0); }
}
function drawItemIcon(item,x,y,s,t,locked){
  // s = half-size; locked -> silhouette
  if(locked){
    ctx.fillStyle="rgba(255,255,255,0.14)";
    ctx.beginPath(); ctx.arc(x,y,s*0.85,0,TAU); ctx.fill();
    ctx.fillStyle="rgba(255,255,255,0.35)"; ctx.font="bold "+Math.round(s*0.9)+"px sans-serif";
    ctx.textAlign="center"; ctx.textBaseline="middle"; ctx.fillText("?",x,y+2); ctx.textBaseline="alphabetic";
    return;
  }
  drawItemShape(item.shape,x,y,s,t);
}
function star2(x,y,r,color,rot){
  ctx.save(); ctx.translate(x,y); ctx.rotate(rot||0); ctx.fillStyle=color; ctx.beginPath();
  for(let i=0;i<10;i++){ const rad=i%2?r*0.45:r, a=-Math.PI/2+i*Math.PI/5;
    ctx[i?"lineTo":"moveTo"](Math.cos(a)*rad,Math.sin(a)*rad); }
  ctx.closePath(); ctx.fill(); ctx.restore();
}

/* ---------------- game state ---------------- */
const Game = window.Game = {
  state:"title", lang:"en", coins:0,
  owned:{}, dupes:{}, themesUnlocked:1, reveals:0,
  muted:false, everPlayed:false, paused:false, pausedByAd:false,
  time:0, timeScale:1, shake:0,
  hits:[], toast:null, toastT:0,
  // conveyor
  belt:[], beltSpeed:1, pickT:0,
  // opening flow
  box:null,           // {theme, golden, rarity, item, x,y,s, sq, cracks}
  peelSegs:[], tapeFly:null,
  smashN:0,
  reveal:null,        // {t, dur, slowmo}
  squish:null,        // {item, rarity, isNew, t, squeeze, sx, sy}
  xrayUntil:0, xrayCdUntil:0,
  goldCdUntil:0,
  albumTab:0, unlockAnim:null,
  shelfFly:[], coinFly:[],

  autoPause(on){
    if(on){ this.paused=true; }

};
function saveProgress(){
  Store.set("coins", Game.coins);
  Store.set("owned", JSON.stringify(Game.owned));
  Store.set("dupes", JSON.stringify(Game.dupes));
  Store.set("themes", Game.themesUnlocked);
  Store.set("reveals", Game.reveals);
  Store.set("muted", Game.muted?"1":"0");
  Store.set("lang", Game.lang);
  Store.set("everPlayed", Game.everPlayed?"1":"0");
}
function loadProgress(){
  Store.get("coins").then(v=>{ if(v==null||v==="") return; const n=parseInt(v,10); if(n>=0) Game.coins=n; }).catch(()=>{});
  Store.get("owned").then(v=>{ try{ const o=JSON.parse(v||"{}"); if(o&&typeof o==="object") Game.owned=o; }catch(e){} }).catch(()=>{});
  Store.get("dupes").then(v=>{ try{ const o=JSON.parse(v||"{}"); if(o&&typeof o==="object") Game.dupes=o; }catch(e){} }).catch(()=>{});
  Store.get("themes").then(v=>{ const n=parseInt(v||"1",10); if(n>=1&&n<=3) Game.themesUnlocked=n; }).catch(()=>{});
  Store.get("reveals").then(v=>{ const n=parseInt(v||"0",10); if(n>=0) Game.reveals=n; }).catch(()=>{});
  Store.get("muted").then(v=>{ Game.muted=v==="1"; Sfx.setMuted(Game.muted); }).catch(()=>{});
  Store.get("lang").then(v=>{ if(!FORCE_EN&&(v==="es"||v==="en")) Game.lang=v; }).catch(()=>{});
  Store.get("everPlayed").then(v=>{ if(v==="1") Game.everPlayed=true; }).catch(()=>{});
}
function toast(t){ Game.toast=t; Game.toastT=1.8; }

/* ---------------- particles & floaters ---------------- */
const parts=[], floaters=[];
function spawnPart(p){ if(parts.length<1200) parts.push(p); }
function paperBit(x,y,vx,vy,c1){
  spawnPart({t:"p",x,y,vx,vy,g:1500,life:1.1,max:1.1,size:8+Math.random()*10,
    c:c1,rot:Math.random()*TAU,vr:(Math.random()-0.5)*14});
}
function sparkle(x,y,c,n,spd){
  n=n||12; spd=spd||220;
  for(let i=0;i<n;i++){ const a=Math.random()*TAU, s=spd*(0.4+Math.random()*0.9);
    spawnPart({t:"s",x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-120,g:300,life:0.9,max:0.9,size:3+Math.random()*3,c}); }
}
function confetti(x,y,n){
  const cols=[{r:255,g:92,b:92},{r:255,g:209,b:77},{r:95,g:214,b:111},{r:77,g:163,b:255},{r:192,g:123,b:255}];
  for(let i=0;i<(n||70);i++){ const a=Math.random()*TAU, s=160+Math.random()*380;
    spawnPart({t:"c",x:x+(Math.random()-0.5)*60,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-320,g:900,
      life:1.8,max:1.8,size:5+Math.random()*5,c:cols[(Math.random()*cols.length)|0],rot:Math.random()*TAU,vr:(Math.random()-0.5)*14}); }
}
function fiber(x,y){
  spawnPart({t:"f",x,y,vx:(Math.random()-0.5)*120,vy:-40-Math.random()*80,g:500,life:0.7,max:0.7,size:2+Math.random()*2,c:{r:240,g:235,b:220}});
}
function crumb(x,y){
  spawnPart({t:"p",x,y,vx:(Math.random()-0.5)*360,vy:-120-Math.random()*220,g:1600,life:0.9,max:0.9,
    size:6+Math.random()*8,c:{r:180,g:130,b:80},rot:Math.random()*TAU,vr:(Math.random()-0.5)*16});
}
function floater(x,y,txt,c,size){ floaters.push({x,y,txt,c:c||"#fff",size:size||24,t:0,dur:1.2}); }
function coinFlyTo(x,y,n){
  for(let i=0;i<n;i++) Game.coinFly.push({x:x+(Math.random()-0.5)*60,y:y+(Math.random()-0.5)*40,t:-i*0.06});
}
function updateParts(dt){
  for(let i=parts.length-1;i>=0;i--){ const p=parts[i];
    p.life-=dt; if(p.life<=0){ parts.splice(i,1); continue; }
    p.vy+=p.g*dt; p.x+=p.vx*dt; p.y+=p.vy*dt;
    if(p.rot!==undefined) p.rot+=p.vr*dt;
    if(p.t==="s") { p.vx*=0.985; p.vy*=0.985; }
  }
  for(let i=floaters.length-1;i>=0;i--){ const f=floaters[i]; f.t+=dt; if(f.t>f.dur) floaters.splice(i,1); }
  // flying coins head to the coin counter (top bar)
  for(let i=Game.coinFly.length-1;i>=0;i--){ const c=Game.coinFly[i];
    c.t+=dt; if(c.t<0) continue;
    const tx=W-70, ty=52, k=Math.min(1,c.t*2.2), e=k*k*(3-2*k);
    c.x=lerp(c.x,tx,e*0.35); c.y=lerp(c.y,ty,e*0.35);
    if(Math.hypot(c.x-tx,c.y-ty)<26){ Game.coinFly.splice(i,1); Sfx.coin(); }
  }
  for(let i=Game.shelfFly.length-1;i>=0;i--){ const s=Game.shelfFly[i];
    s.t+=dt; const k=Math.min(1,s.t/0.8), e=k*k*(3-2*k);
    s.x=lerp(s.x0,s.x1,e); s.y=lerp(s.y0,s.y1,e); s.s=lerp(s.s0,26,e);
    if(k>=1) Game.shelfFly.splice(i,1);
  }
}

/* ---------------- boxes & conveyor ---------------- */
function newBox(golden, themeIdx){
  const ti = themeIdx!==undefined ? themeIdx : activeThemeIdx();
  const rar = rollRarity(null, !!golden);
  const item = pickItem(THEMES[ti].id, rar, null);
  return { theme:ti, golden:!!golden, rarity:rar, item, x:0, y:0, s:1, sq:1, bob:Math.random()*TAU, cracks:0 };
}
function spawnBelt(){
  Game.belt.length=0;
  for(let i=0;i<4;i++){
    const b=newBox(false);
    b.x = 140 + i*165;
    Game.belt.push(b);
  }
}
function beltBoxPos(i, t){
  // boxes ride the belt rightward, wrap around
  const spacing=190, x0=-110;
  const x = x0 + ((i*spacing + t*130) % (spacing*5));
  return x;
}
function pickBox(b){
  Game.box=b;
  Game.box.x=W/2; Game.box.y=700; Game.box.sq=1; Game.box.cracks=0;
  Game.smashN=0;
  // peel segments across the tape
  Game.peelSegs=[];
  const n=14, x0=W/2-150, x1=W/2+150;
  for(let i=0;i<n;i++) Game.peelSegs.push({x:x0+(x1-x0)*(i+0.5)/n, peeled:false, curl:0});
  Game.tapeFly=null;
  Game.state="peel";
  Sfx.select(); buzz(20);
  try{ Portal.gameplayStart(); }catch(e){}
}
function peelProgress(){
  const done=Game.peelSegs.filter(s=>s.peeled).length;
  return Game.peelSegs.length?done/Game.peelSegs.length:1;
}
function finishPeel(){
  Game.state="peelDone"; Game.peelT=0;
  Game.tapeFly={x:W/2,y:560,vx:260+Math.random()*120,vy:-380,rot:0,vr:9};
  Sfx.tapeRip(); buzz([30,40,30]);
  for(let i=0;i<10;i++) fiber(W/2+(Math.random()-0.5)*260, 560+(Math.random()-0.5)*20);
}
function smashBox(){
  Game.smashN++;
  Game.box.sq=0.55; // squash spring target handled in update
  Game.box.cracks=Game.smashN;
  Sfx.smash(); buzz(45);
  for(let i=0;i<12;i++) crumb(Game.box.x+(Math.random()-0.5)*180, Game.box.y+(Math.random()-0.5)*140);
  Game.shake=Math.max(Game.shake,0.25);
  if(Game.smashN>=3){
    // burst!
    for(let i=0;i<26;i++) paperBit(Game.box.x+(Math.random()-0.5)*200, Game.box.y+(Math.random()-0.5)*160,
      (Math.random()-0.5)*520, -200-Math.random()*380, {r:210,g:170,b:120});
    for(let i=0;i<14;i++) crumb(Game.box.x+(Math.random()-0.5)*120, Game.box.y);
    startReveal();
  }
}
function startReveal(){
  const rar=Game.box.rarity;
  const slowmo = rar>=2; // epic + legendary
  Game.reveal={t:0, dur: slowmo?2.1:1.4, slowmo, pop:0};
  if(slowmo) Game.timeScale=0.28;
  Game.state="reveal";
  const rc=RAR[rar];
  if(rar===3){ Sfx.fanfare(); buzz([60,50,60,50,120]); Game.shake=0.8; }
  else Sfx.shimmer();
  const bx=W/2, by=660;
  sparkle(bx,by-40,{r:255,g:255,b:255},26,300);
  const gc={r:parseInt(rc.col.slice(1,3),16),g:parseInt(rc.col.slice(3,5),16),b:parseInt(rc.col.slice(5,7),16)};
  sparkle(bx,by,gc,rar===3?60:30,rar===3?420:280);
  if(rar===3) confetti(bx,by-100,80);
}
function finishReveal(){
  const r=Game.reveal; if(!r) return;
  Game.reveal=null; // consumir de inmediato: update() y taps no deben re-disparar
  const b=Game.box, item=b.item, rar=b.rarity;
  const isNew=!Game.owned[item.id];
  Game.squish={item, rarity:rar, isNew, t:0, squeeze:0, sx:1, sy:1, vx:0, vy:0, done:false};
  Game.state="squish";
  Game.timeScale=1;
  const reward=RAR[rar].coins;
  Game.coins+=reward;
  Game.reveals++;
  coinFlyTo(W/2,660,Math.min(8,2+rar*2));
  floater(W/2,480,"+"+reward, "#ffe14d", 34);
  if(isNew){
    confetti(W/2,500,50);
    Sfx.unlock();
  }
  saveProgress();
  try{ Portal.scoreChanged(Game.coins); }catch(e){}
}
function resolveSquish(){
  const sq=Game.squish; if(!sq||sq.done) return;
  sq.done=true;
  const item=sq.item;
  if(sq.isNew){
    Game.owned[item.id]=1;
    floater(W/2,420,T("new_item"),"#b9f6ca",30);
  } else {
    Game.dupes[item.id]=(Game.dupes[item.id]||0)+1;
    Game.coins+=2;
    coinFlyTo(W/2,700,3);
    floater(W/2,420,T("dupe_item"),"#ffe14d",28);
    Game.shelfFly.push({x0:W/2,y0:640,x1:313,y1:58,s0:70,s:70,t:0,x:W/2,y:640,item});
  }
  saveProgress();
  // set completion check
  const th=THEMES.find(t=>t.id===item.theme);
  if(th.items.every(it=>Game.owned[it.id])){
    Game.coins+=50;
    saveProgress();
    if(Game.themesUnlocked<THEMES.length){
      Game.themesUnlocked++;
      Game.unlockAnim={t:0, theme:THEMES[Game.themesUnlocked-1]};
      Sfx.unlock();
    } else {
      Game.unlockAnim={t:0, theme:null};
    }
    saveProgress();
  }
  try{ Portal.scoreChanged(Game.coins); }catch(e){}
  // interstitial every 6 reveals, on natural pause
  if(Game.reveals%6===0){ try{ Portal.showInterstitial(); }catch(e){} }
}
function continueFromSquish(){
  resolveSquish();
  Game.squish=null; Game.box=null; Game.reveal=null;
  spawnBelt();
  Game.state="conveyor";
  try{ Portal.gameplayStop(); }catch(e){}
}

/* rewarded: golden box & x-ray */
function requestGolden(){
  const P=window.Portal;
  const start=()=>{ const b=newBox(true); pickBox(b); toast(T("golden_ready")); };
  if(P&&P.rewarded){ try{ P.showRewarded(ok=>{ if(ok) start(); else toast(T("watch_ad")); }); }catch(e){ start(); } }
  else {
    if(Game.coins>=60){ Game.coins-=60; saveProgress(); start(); }
    else { toast(T("not_enough")); Sfx.error&&Sfx.error(); }
  }
}
function requestXray(){
  const P=window.Portal;
  const start=()=>{ Game.xrayUntil=Game.time+10; toast(T("xray_on")); Sfx.shimmer(); };
  if(P&&P.rewarded){ try{ P.showRewarded(ok=>{ if(ok) start(); else toast(T("watch_ad")); }); }catch(e){ start(); } }
  else {
    if(Game.time>=Game.xrayCdUntil){ Game.xrayCdUntil=Game.time+60; start(); }
    else toast(T("free_in")+" "+Math.ceil(Game.xrayCdUntil-Game.time)+"s");
  }
}

/* ---------------- render ---------------- */
const cvs=document.getElementById("game"), ctx=cvs.getContext("2d");
let viewScale=1;
function fit(){

  cvs.style.width=(W*viewScale)+"px"; cvs.style.height=(H*viewScale)+"px";

function drawBG(){
  const g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,"#2b1b4d"); g.addColorStop(0.5,"#1d1236"); g.addColorStop(1,"#120b24");
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
  const t=Game.time;
  // ambient glow orbs
  [[140,240,130,"255,150,90"],[580,420,150,"150,110,255"],[360,1050,170,"90,200,255"]].forEach(o=>{
    const gg=ctx.createRadialGradient(o[0],o[1]+Math.sin(t*0.7+o[0])*12,10,o[0],o[1],o[2]);
    gg.addColorStop(0,"rgba("+o[3]+",0.10)"); gg.addColorStop(1,"rgba("+o[3]+",0)");
    ctx.fillStyle=gg; ctx.fillRect(o[0]-o[2],o[1]-o[2],o[2]*2,o[2]*2);
  });
  // floating background sparkles
  ctx.fillStyle="rgba(255,255,255,0.10)";
  for(let i=0;i<24;i++){
    const sx=(i*197.3)%W, sy=(i*331.7 + t*14)%H;
    ctx.beginPath(); ctx.arc(sx,sy,2.2,0,TAU); ctx.fill();
  }
  // floor
  const fg=ctx.createLinearGradient(0,1120,0,H);
  fg.addColorStop(0,"#241640"); fg.addColorStop(1,"#160e2b");
  ctx.fillStyle=fg; ctx.fillRect(0,1120,W,H-1120);
}
function drawCoinIcon(x,y,r){
  const g=ctx.createRadialGradient(x-r*0.3,y-r*0.3,r*0.2,x,y,r);
  g.addColorStop(0,"#ffe98a"); g.addColorStop(1,"#e09a2a");
  ctx.fillStyle=g; ctx.beginPath(); ctx.arc(x,y,r,0,TAU); ctx.fill();
  ctx.strokeStyle="#a86f14"; ctx.lineWidth=2.5; ctx.stroke();
  ctx.fillStyle="#a86f14"; ctx.font="bold "+Math.round(r*1.1)+"px sans-serif";
  ctx.textAlign="center"; ctx.textBaseline="middle"; ctx.fillText("$",x,y+1); ctx.textBaseline="alphabetic";
}
function button(id,x,y,w,h,label,fs,bg,fg){
  fs=fs||24; bg=bg||"rgba(255,255,255,0.10)"; fg=fg||"#fff";

/* mystery box drawing */
function drawBox(b, opts){
  opts=opts||{};
  const th=THEMES[b.theme];
  const w=230, h=200;
  const sq=b.sq||1;
  ctx.save();
  ctx.translate(b.x, b.y + Math.sin(Game.time*2.2+b.bob)*8*(opts.onBelt?1:0.3));
  ctx.scale(2-sq, sq); // squash & stretch (sq<1 => squash)
  if(opts.onBelt && Game.xrayUntil>Game.time){
    const rc=RAR[b.rarity];
    ctx.shadowColor=rc.col; ctx.shadowBlur=34;
  }
  if(b.golden){ ctx.shadowColor="#ffd94d"; ctx.shadowBlur=30; }
  // body
  const g=ctx.createLinearGradient(0,-h/2,0,h/2);
  if(b.golden){ g.addColorStop(0,"#ffe98a"); g.addColorStop(0.5,"#f5b93c"); g.addColorStop(1,"#c07f1a"); }
  else { g.addColorStop(0,th.boxC1); g.addColorStop(1,th.boxC2); }
  ctx.fillStyle=g; rr(ctx,-w/2,-h/2,w,h,22); ctx.fill();
  ctx.shadowBlur=0;
  // flaps
  ctx.strokeStyle="rgba(0,0,0,0.22)"; ctx.lineWidth=4;
  ctx.beginPath(); ctx.moveTo(-w/2+14,-h/2+34); ctx.lineTo(w/2-14,-h/2+34); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(0,-h/2+34); ctx.lineTo(0,h/2-10); ctx.stroke();
  // side shading
  ctx.fillStyle="rgba(0,0,0,0.12)"; rr(ctx,-w/2,-h/2,26,h,22); ctx.fill();
  ctx.fillStyle="rgba(255,255,255,0.10)"; rr(ctx,w/2-40,-h/2,40,h,22); ctx.fill();
  // "?" sticker
  ctx.fillStyle=th.sticker; ctx.beginPath(); ctx.arc(0,10,52,0,TAU); ctx.fill();
  ctx.strokeStyle="rgba(0,0,0,0.2)"; ctx.lineWidth=4; ctx.stroke();
  ctx.fillStyle=b.golden?"#8a5a00":"#4a3220"; ctx.font="bold 64px sans-serif";
  ctx.textAlign="center"; ctx.textBaseline="middle";
  if(Game.xrayUntil>Game.time && opts.onBelt){
    ctx.font="bold 26px sans-serif"; ctx.fillText(RAR[b.rarity].name[Game.lang],0,12);
  } else {
    ctx.fillText("?",0,14);
  }
  ctx.textBaseline="alphabetic";
  // cracks (smash stage)
  if(b.cracks>0){
    ctx.strokeStyle="rgba(40,20,10,0.75)"; ctx.lineWidth=5; ctx.lineCap="round";
    for(let i=0;i<b.cracks*2;i++){
      const cx=-70+(i*67)%140, cy=-60+((i*53)%110);
      ctx.beginPath(); ctx.moveTo(cx,cy); ctx.lineTo(cx+18,cy+26); ctx.lineTo(cx+6,cy+52); ctx.stroke();
    }
  }
  // tape (peel stage)
  if(opts.tape){
    const ty=-h/2+34;
    Game.peelSegs.forEach(sg=>{
      const sx=sg.x-b.x, sw=(300/Game.peelSegs.length);
      if(!sg.peeled){
        ctx.fillStyle="rgba(245,230,200,0.95)";
        ctx.fillRect(sx-sw/2, ty-20, sw, 40);
        ctx.fillStyle="rgba(0,0,0,0.10)";
        ctx.fillRect(sx-sw/2, ty+8, sw, 6);
      } else if(sg.curl<1){
        // curling peeled bit
        ctx.save(); ctx.translate(sx,ty-20); ctx.rotate(-sg.curl*1.4);
        ctx.fillStyle="rgba(245,230,200,0.9)";
        ctx.fillRect(-sw/2, -40*sg.curl, sw, 40);
        ctx.restore();
      }
    });
    ctx.strokeStyle="rgba(0,0,0,0.25)"; ctx.lineWidth=3;
    ctx.strokeRect(-150,ty-20,300,40);
  }
  ctx.restore();
  // tape fly-off piece
  if(Game.tapeFly){
    const tf=Game.tapeFly;
    ctx.save(); ctx.translate(tf.x,tf.y); ctx.rotate(tf.rot);
    ctx.fillStyle="rgba(245,230,200,0.95)"; ctx.fillRect(-150,-20,300,40);
    ctx.fillStyle="rgba(0,0,0,0.12)"; ctx.fillRect(-150,8,300,6);
    ctx.restore();
  }
}

        ctx.fillStyle=gg; ctx.beginPath(); ctx.arc(cx,cy-30,90,0,TAU); ctx.fill();
      }
      drawItemIcon(it,cx,cy-30,62,Game.time+i,!owned);
      ctx.fillStyle=owned?"#fff":"rgba(255,255,255,0.35)";
      ctx.font="bold 20px sans-serif";
      const nm=owned?it.name[Game.lang]:rc.name[Game.lang];
      ctx.fillText(nm.length>14?nm.slice(0,13)+"…":nm,cx,cy+78);
      const dn=Game.dupes[it.id]||0;
      if(dn>0){ ctx.fillStyle="#ffe14d"; ctx.font="bold 20px sans-serif";
        ctx.fillText("×"+dn,cx+cw/2-24,cy-ch/2+28); }
    });
  }
  button("backC",60,1150,600,72,T("back"),26);
  drawUnlockAnim();
}
function drawShelf(){
  drawBG();
  drawTopBar();
  ctx.textAlign="center";
  ctx.fillStyle="#fff"; ctx.font="bold 40px sans-serif";
  ctx.fillText(T("shop"),W/2,170);
  // shop awning
  ctx.fillStyle="#e84a6a";
  for(let i=0;i<9;i++){ ctx.fillStyle=i%2?"#e84a6a":"#fff";
    ctx.beginPath(); ctx.moveTo(60+i*67,210); ctx.lineTo(60+(i+1)*67,210);
    ctx.lineTo(60+(i+1)*67-14,260); ctx.lineTo(60+i*67-14,260); ctx.closePath(); ctx.fill(); }
  ctx.fillStyle="#8a2f45"; ctx.fillRect(46,196,628,16);
  // stocked dupes on wooden shelves
  const stocked=[];
  for(const id in Game.dupes){ const n=Game.dupes[id]; for(let i=0;i<Math.min(n,6);i++) stocked.push(ITEMS[id]); }
  ctx.fillStyle="rgba(255,255,255,0.75)"; ctx.font="24px sans-serif";
  let total=0; for(const id in Game.dupes) total+=Game.dupes[id];
  ctx.fillText(T("stock")+": "+total,W/2,300);
  for(let s=0;s<3;s++){
    const sy=420+s*250;
    ctx.fillStyle="#6b4a2e"; ctx.fillRect(50,sy,620,26);
    ctx.fillStyle="#8a6238"; ctx.fillRect(50,sy,620,9);
    for(let i=0;i<6;i++){
      const it=stocked[s*6+i];
      if(!it) break;
      const px=110+i*104;
      drawItemShape(it.shape,px,sy-72+Math.sin(Game.time*2+i)*5,44,Game.time+i);
      ctx.fillStyle="rgba(0,0,0,0.25)";
      ctx.beginPath(); ctx.ellipse(px,sy-16,40,10,0,0,TAU); ctx.fill();
    }
  }
  if(total===0){
    ctx.fillStyle="rgba(255,255,255,0.55)"; ctx.font="26px sans-serif";
    ctx.fillText(Game.lang==="es"?"Tus duplicados aparecerán aquí":"Your dupes will appear here",W/2,640);
  }
  button("backC",60,1150,600,72,T("back"),26);
  drawParts();
}
function drawUnlockAnim(){
  const ua=Game.unlockAnim; if(!ua) return;
  const t=ua.t, k=clamp(t/0.6,0,1), e=easeOutBack(k);
  ctx.fillStyle="rgba(0,0,0,"+(0.55*clamp(t*2,0,1))+")"; ctx.fillRect(0,0,W,H);
  ctx.save(); ctx.translate(W/2,560); ctx.scale(e,e);
  ctx.fillStyle="#2b1b4d"; rr(ctx,-290,-150,580,300,28); ctx.fill();
  ctx.strokeStyle="#ffe14d"; ctx.lineWidth=6; ctx.stroke();
  ctx.textAlign="center"; ctx.fillStyle="#ffe14d"; ctx.font="bold 44px sans-serif";
  ctx.fillText(T("set_complete"),0,-60);
  if(ua.theme){
    ctx.fillStyle="#fff"; ctx.font="bold 34px sans-serif";
    ctx.fillText(T("theme_unlocked"),0,10);
    ctx.fillStyle=ua.theme.boxC1; ctx.font="bold 30px sans-serif";
    ctx.fillText(ua.theme.name[Game.lang],0,64);
    drawBox({x:0,y:0,theme:THEMES.indexOf(ua.theme),golden:false,rarity:0,bob:0,sq:1,cracks:0},{});
  } else {
    ctx.fillStyle="#fff"; ctx.font="30px sans-serif";
    ctx.fillText("+50",0,40);
    drawCoinIcon(0,100,30);
  }
  ctx.restore();
  confetti(W/2,400,3);
  if(t>2.6) Game.unlockAnim=null;
}
function draw(){
  Game.hits.length=0;
  ctx.save();
  if(Game.shake>0){ ctx.translate((Math.random()-0.5)*22*Game.shake,(Math.random()-0.5)*22*Game.shake); }
  const st=Game.state;
  if(st==="title") drawTitle();
  else if(st==="conveyor") drawConveyor();
  else if(st==="peel") drawPeel();
  else if(st==="peelDone") drawPeelDone();
  else if(st==="smash") drawSmash();
  else if(st==="reveal") drawReveal();
  else if(st==="squish") drawSquish();
  else if(st==="album") drawAlbum();
  else if(st==="shelf") drawShelf();
  ctx.restore();
  if(Game.unlockAnim && (st==="album"||st==="conveyor")){ /* drawn inside screens */ }
  // self-test overlay
  if(SelfTest.done){
    ctx.fillStyle="rgba(0,0,0,0.85)"; ctx.fillRect(0,H-150,W,150);
    ctx.fillStyle=SelfTest.fails?"#ff8a80":"#b9f6ca"; ctx.font="bold 26px sans-serif"; ctx.textAlign="center";
    ctx.fillText("SELFTEST "+SelfTest.pass+"/"+SelfTest.total+(SelfTest.fails?" FAIL":" PASS"),W/2,H-80);
    if(SelfTest.fails){ ctx.font="18px sans-serif"; ctx.fillStyle="#ffb3a7"; ctx.fillText(SelfTest.firstFail||"",W/2,H-40); }
  }
}

/* Sfx.error (used by golden-box coin fallback) */
Sfx.error=function(){ this.tone(160,0.18,"square",0.10,110); };

/* ---------------- input ---------------- */
function gamePos(e){
  const r=cvs.getBoundingClientRect();
  return { x:(e.clientX-r.left)/r.width*W, y:(e.clientY-r.top)/r.height*H };
}
function peelAt(x,y){
  const b=Game.box; if(!b) return;
  const ty=b.y-66;
  Game.peelSegs.forEach(sg=>{
    if(!sg.peeled && Math.abs(x-sg.x)<46 && Math.abs(y-ty)<80){
      sg.peeled=true; sg.curl=0;
      fiber(sg.x,ty+(Math.random()-0.5)*30);
      Sfx.peel(peelProgress());
      buzz(12);
    }
  });
  if(peelProgress()>=1 && Game.state==="peel") finishPeel();
}
function handleButton(id){
  Sfx.click();
  if(id==="play"){ Game.state="conveyor"; spawnBelt(); if(!Game.everPlayed){ Game.everPlayed=true; Game.showHowto=true; saveProgress(); } }
  else if(id==="howto"){ if(Game.state==="title") Game.titleHowto=true; else Game.showHowto=true; }
  else if(id==="gotit"){ Game.titleHowto=false; Game.showHowto=false; }
  else if(id==="sound"){ Game.muted=!Game.muted; Sfx.setMuted(Game.muted); saveProgress(); }
  else if(id==="lang"){ if(!FORCE_EN){ Game.lang=Game.lang==="es"?"en":"es"; saveProgress(); } }
  else if(id==="album"){ Game.backTo=Game.state; Game.albumTab=activeThemeIdx(); Game.state="album"; }
  else if(id==="shelf"){ Game.backTo=Game.state; Game.state="shelf"; }
  else if(id==="albumT"){ Game.backTo="title"; Game.albumTab=activeThemeIdx(); Game.state="album"; }
  else if(id==="shelfT"){ Game.backTo="title"; Game.state="shelf"; }
  else if(id==="menu"){ Game.state="title"; try{Portal.gameplayStop();}catch(e){} }
  else if(id==="backC"){ Game.state=Game.backTo||"conveyor"; if(Game.state==="conveyor"&&!Game.belt.length) spawnBelt(); }
  else if(id==="golden"){ requestGolden(); }
  else if(id==="xray"){ requestXray(); }
  else if(id==="continue"){ continueFromSquish(); }
  else if(id.indexOf("tab")===0){ const n=parseInt(id.slice(3),10); if(n<Game.themesUnlocked) Game.albumTab=n; }
  else if(id.indexOf("box")===0){
    const n=parseInt(id.slice(3),10);
    if(Game.belt[n]) pickBox(Game.belt[n]);
  }
  else if(id==="smashBox"){ smashBox(); }
  else if(id==="squishItem"){ Game.squeezing=true; Sfx.squish(false); buzz(25); }
}
function onDown(x,y){
  if(Sfx.ensure()&&!Sfx._musicOn&&!Game.muted) Sfx.startMusic();
  for(let i=Game.hits.length-1;i>=0;i--){
    const h=Game.hits[i];
    if(x>=h.x&&x<=h.x+h.w&&y>=h.y&&y<=h.y+h.h){ handleButton(h.id); return; }
  }
  const st=Game.state;
  if(st==="peel"){ Game.peeling=true; peelAt(x,y); }
  else if(st==="squish"&&Game.squish){
    const dx=x-W/2, dy=y-640;
    if(dx*dx+dy*dy<190*190){ Game.squeezing=true; Sfx.squish(false); buzz(25); }
  }
  else if(st==="reveal"&&Game.reveal&&Game.reveal.t>0.7){ finishReveal(); }
}
function onMove(x,y){ if(Game.peeling&&Game.state==="peel") peelAt(x,y); }
function onUp(){ Game.peeling=false; if(Game.squeezing){ Game.squeezing=false; Sfx.pop(); } }

/* ---------------- update ---------------- */
function update(rawDt){
  const dt=rawDt*Game.timeScale;
  Game.time+=dt;
  // slow-mo recovery
  if(Game.timeScale<1) Game.timeScale=Math.min(1,Game.timeScale+rawDt*0.9);
  if(Game.shake>0) Game.shake=Math.max(0,Game.shake-rawDt*1.8);
  if(Game.toastT>0) Game.toastT-=rawDt;
  updateParts(dt);
  // peel curl animation + tape fly
  Game.peelSegs.forEach(sg=>{ if(sg.peeled&&sg.curl<1) sg.curl=Math.min(1,sg.curl+rawDt*3.2); });
  if(Game.tapeFly){ const tf=Game.tapeFly;
    tf.x+=tf.vx*rawDt; tf.y+=tf.vy*rawDt; tf.vy+=900*rawDt; tf.rot+=tf.vr*rawDt; }
  if(Game.state==="peelDone"){ Game.peelT+=rawDt; if(Game.peelT>0.55){ Game.state="smash"; Game.tapeFly=null; } }
  // box squash spring
  if(Game.box){
    const b=Game.box, target=1;
    b._sv=(b._sv||0);
    b._sv+=((target-b.sq)*170-b._sv*13)*rawDt; b.sq+=b._sv*rawDt;
  }
  // reveal timing (unscaled so slow-mo lasts real time)
  if(Game.reveal){
    const rv=Game.reveal; rv.t+=rawDt;
    if(rv.t>=rv.dur) finishReveal();
  }
  // squish spring physics
  const sq=Game.squish;
  if(sq){
    sq.t+=rawDt;
    if(Game.squeezing){
      // apretado: acercamiento exponencial amortiguado (sin oscilación)
      const k=Math.min(1,rawDt*10);
      sq.sx+=(1.32-sq.sx)*k; sq.sy+=(0.66-sq.sy)*k; sq.vx=0; sq.vy=0;
    } else {
      // soltar: muelle con jiggle
      sq.vx+=((1-sq.sx)*170-sq.vx*9)*rawDt; sq.sx+=sq.vx*rawDt;
      sq.vy+=((1-sq.sy)*170-sq.vy*9)*rawDt; sq.sy+=sq.vy*rawDt;
    }
    if(Game.squeezing && !sq._sqT){ sq._sqT=0; }
    if(Game.squeezing){ sq._sqT=(sq._sqT||0)+rawDt; if(sq._sqT>0.4){ sq._sqT=0; Sfx.squish(true); } }
  }
  if(Game.unlockAnim) Game.unlockAnim.t+=rawDt;
}

/* ---------------- main loop & boot ---------------- */
let lastT=0, frames=0;
function loop(t){
  requestAnimationFrame(loop);
  const rawDt=Math.min(0.05,((t-lastT)/1000)||0.016); lastT=t;
  if(!Game.paused) update(rawDt);
  draw();
  frames++;
  if(frames===2){ try{ Portal.gameReady(); }catch(e){} try{ if(Portal.loadingStop) Portal.loadingStop(); }catch(e){} }
}

/* ---------------- self-test (?test=1) ---------------- */
const SelfTest={done:false,pass:0,total:0,fails:0,firstFail:""};
function st(name,cond){ SelfTest.total++; if(cond){SelfTest.pass++;} else { SelfTest.fails++; if(!SelfTest.firstFail) SelfTest.firstFail=String(name).slice(0,90); } }
function runSelfTest(){
  try{
    // rarity math
    let wsum=0; RAR.forEach(r=>wsum+=r.w);
    st("rarity weights sum 100", wsum===100);
    const rngA=mulberry32(1234), rngB=mulberry32(1234);
    let det=true;
    for(let i=0;i<50;i++) if(rollRarity(rngA)!==rollRarity(rngB)) det=false;
    st("rollRarity deterministic", det);
    const cnt=[0,0,0,0], rngC=mulberry32(99);
    for(let i=0;i<4000;i++) cnt[rollRarity(rngC)]++;
    st("rarity distribution sane", cnt[0]>1900&&cnt[0]<2500&&cnt[3]>60&&cnt[3]<320);
    const rngG=mulberry32(7);
    let goldOk=true;
    for(let i=0;i<200;i++) if(rollRarity(rngG,true)===0) goldOk=false;
    st("golden box never common", goldOk);
    // items
    st("24 items", Object.keys(ITEMS).length===24);
    let itemOk=true;
    for(const id in ITEMS){ const it=ITEMS[id];
      if(!SHAPES[it.shape]) itemOk=false;
      if(it.rar<0||it.rar>3) itemOk=false;
      if(!it.name.en||!it.name.es) itemOk=false;
    }
    st("items valid", itemOk);
    const pi=pickItem("t0",3,null);
    st("pickItem legendary t0 = dumpling", pi&&pi.id==="t0_dumpling");
    // box flow: pick -> peel -> smash -> reveal -> squish -> resolve
    spawnBelt();
    st("belt has 4 boxes", Game.belt.length===4);
    const b0=Game.belt[0];
    pickBox(b0);
    st("pick -> peel", Game.state==="peel"&&Game.peelSegs.length===14);
    Game.peelSegs.forEach(sg=>{ sg.peeled=true; });
    st("peel progress 1", peelProgress()===1);
    finishPeel();
    st("finishPeel -> peelDone", Game.state==="peelDone");
    Game.peelT=1; update(0.016);
    st("peelDone -> smash", Game.state==="smash");
    smashBox(); smashBox();
    st("2 smashes, box cracked", Game.smashN===2&&Game.state==="smash");
    smashBox();
    st("3rd smash -> reveal", Game.state==="reveal"&&!!Game.reveal);
    const coinsBefore=Game.coins;
    // fast-forward reveal
    Game.reveal.t=Game.reveal.dur; update(0.016);
    st("reveal -> squish", Game.state==="squish"&&!!Game.squish);
    const revCount=Game.reveals, coinsAfterReveal=Game.coins;
    for(let i=0;i<30;i++) update(0.016); // el loop no debe re-disparar el reveal
    st("reveal fires exactly once", Game.reveals===revCount&&Game.coins===coinsAfterReveal);
    st("reveal paid coins", Game.coins>coinsBefore);
    const itId=Game.squish.item.id;
    const wasNew=!Game.owned[itId];
    // squish spring physics runs
    Game.squeezing=true; for(let i=0;i<20;i++) update(0.016); Game.squeezing=false;
    st("squish spring deforms", Game.squish.sx>1.01||Game.squish.sy<0.99);
    for(let i=0;i<40;i++) update(0.016);
    st("squish spring recovers", Math.abs(Game.squish.sx-1)<0.08&&Math.abs(Game.squish.sy-1)<0.08);
    continueFromSquish();
    st("continue -> conveyor", Game.state==="conveyor");
    st(wasNew?"new item owned":"dupe stocked", wasNew?!!Game.owned[itId]:(Game.dupes[itId]||0)>=1);
    // dupe path forced
    const dupItem=ITEMS[itId];
    Game.owned[itId]=1;
    pickBox(newBox(false,0)); Game.box.item=dupItem; // force same item
    Game.peelSegs.forEach(sg=>sg.peeled=true); finishPeel(); Game.peelT=1; update(0.016);
    smashBox();smashBox();smashBox();
    Game.reveal.t=Game.reveal.dur; update(0.016);
    const dcBefore=Game.coins;
    continueFromSquish();
    st("dupe gives +2 coins & stock", Game.coins>=dcBefore+2&&(Game.dupes[itId]||0)>=1);
    // set completion unlocks theme
    THEMES[0].items.forEach(it=>{ Game.owned[it.id]=1; });
    Game.squish={item:THEMES[0].items[0],rarity:0,isNew:false,t:0,squeeze:0,sx:1,sy:1,vx:0,vy:0,done:false};
    resolveSquish();
    st("set complete unlocks theme 2", Game.themesUnlocked>=2&&!!Game.unlockAnim);
    st("activeTheme advances", activeThemeIdx()>=1);
    // localization
    Game.lang="es"; st("ES strings", T("play")==="JUGAR"&&T("continue")==="CONTINUAR");
    Game.lang="en"; st("EN strings", T("play")==="PLAY");
    // render smoke: every state draws without exceptions
    Game.state="title"; draw(); st("draw title",true);
    spawnBelt(); Game.state="conveyor"; draw(); st("draw conveyor",true);
    pickBox(Game.belt[1]); draw(); st("draw peel",true);
    Game.peelSegs.forEach(sg=>sg.peeled=true); finishPeel(); Game.peelT=1; update(0.016); draw(); st("draw smash",true);
    smashBox();smashBox();smashBox(); draw(); st("draw reveal",true);
    Game.reveal.t=Game.reveal.dur; update(0.016); draw(); st("draw squish",true);
    Game.albumTab=0; Game.state="album"; draw(); st("draw album",true);
    Game.state="shelf"; draw(); st("draw shelf",true);
    Game.showHowto=true; Game.state="conveyor"; draw(); st("draw howto overlay",true); Game.showHowto=false;
    Game.state="title";
    // xray / golden request paths (no portal => coin path)
    const c0=Game.coins; Game.coins=100; requestGolden();
    st("golden coin path starts peel", Game.state==="peel"&&Game.coins===40);
    Game.state="conveyor"; spawnBelt();
    requestXray(); st("xray free path", Game.xrayUntil>Game.time);
    Game.coins=c0;
  }catch(e){ st("exception: "+(e&&e.message),false); }
  SelfTest.done=true;
  const msg="SELFTEST "+SelfTest.pass+"/"+SelfTest.total+(SelfTest.fails?" FAIL":" PASS");
  try{ document.title=msg; }catch(e){}
  console.log("[blindboxpantry] "+msg+(SelfTest.firstFail?" :: "+SelfTest.firstFail:""));
}

/* test/QA hooks */
window.BBP={ Game,Store,Sfx,SelfTest,runSelfTest,ITEMS,THEMES,RAR,rollRarity,pickItem,
  newBox,pickBox,spawnBelt,peelProgress,finishPeel,smashBox,finishReveal,resolveSquish,
  continueFromSquish,loadProgress,requestGolden,requestXray,activeThemeIdx,T,
  qa:{
    pickFirst(){ if(Game.state==="title") handleButton("play"); if(Game.belt[0]) pickBox(Game.belt[0]); },
    peelAll(){ Game.peelSegs.forEach(sg=>sg.peeled=true); if(Game.state==="peel") finishPeel(); },
    smashAll(){ Game.peelT=1; update(0.016); smashBox(); smashBox(); smashBox(); },
    skipReveal(){ if(Game.reveal){ Game.reveal.t=Game.reveal.dur; update(0.016); } },
    finishSquish(){ continueFromSquish(); },
    state(){ return Game.state; }
  }
};

/* boot */
try{
  fit(); loadProgress();
  if(!FORCE_EN){
    try{ if((navigator.language||"en").toLowerCase().indexOf("es")===0 && !localStorage.getItem("blindboxpantry_lang")) Game.lang="es"; }catch(e){}
  } else Game.lang="en";
  try{ if(window.Portal&&Portal.loadingStart) Portal.loadingStart(); }catch(e){}
  requestAnimationFrame(loop);
  try{ Portal.boot(); }catch(e){}
  if(document.addEventListener){
    document.addEventListener("visibilitychange",()=>{ try{ if(document.hidden) Game.autoPause(true); else Game.autoPause(false); }catch(e){} });
    window.addEventListener("blur",()=>{ try{Game.autoPause(true);}catch(e){} });
    window.addEventListener("focus",()=>{ try{Game.autoPause(false);}catch(e){} });
    const dn=e=>{ try{ const p=gamePos(e); onDown(p.x,p.y); }catch(err){} };
    const mv=e=>{ try{ const p=gamePos(e); onMove(p.x,p.y); }catch(err){} };
    cvs.addEventListener("pointerdown",dn,{passive:true});
    window.addEventListener("pointermove",mv,{passive:true});
    window.addEventListener("pointerup",()=>{ try{onUp();}catch(err){} },{passive:true});
    window.addEventListener("pointercancel",()=>{ try{onUp();}catch(err){} },{passive:true});
  }
  const qs=(typeof location!=="undefined"&&location.search)||"";
  if(qs.indexOf("test=1")>=0) setTimeout(runSelfTest,900);
}catch(e){ try{console.log("boot-fail "+e.message);}catch(_){}}
